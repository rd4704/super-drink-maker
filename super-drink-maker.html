<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Drink Maker 🧋</title>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    :root {
      --bg: #fff0f8;
      --primary: #ff6eb4;
      --accent: #b388ff;
      --text: #4a4a4a;
      --card: #ffffff;
      --shadow: rgba(180,120,200,0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Bubblegum Sans', cursive;
      font-size: clamp(16px, 4vw, 22px);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    h1 {
      font-size: clamp(24px, 6vw, 36px);
      color: var(--primary);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.3s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .crystal-bar {
      position: fixed;
      top: 0.5rem;
      right: 1rem;
      background: var(--card);
      border-radius: 2rem;
      padding: 0.4rem 1rem;
      box-shadow: 0 2px 8px var(--shadow);
      font-size: 0.9em;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .crystal-bar img {
      width: 24px;
      height: 24px;
    }

    .cup-container {
      margin: 1rem 0;
    }

    .color-grid, .topping-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin: 1rem 0;
      width: 100%;
    }

    .color-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
      box-shadow: 0 3px 6px var(--shadow);
    }

    .color-btn:active {
      transform: translateY(3px);
    }

    .color-btn.selected {
      border-color: var(--text);
      transform: scale(1.1);
    }

    .topping-btn {
      background: var(--card);
      border: none;
      border-radius: 1.5rem;
      padding: 0.8rem;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
      transition: transform 0.1s, opacity 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .topping-btn img {
      width: 48px;
      height: 48px;
    }

    .topping-btn .topping-label {
      font-size: 0.7em;
      color: var(--accent);
    }

    .topping-btn:active {
      transform: translateY(4px);
    }

    .topping-btn.selected {
      background: var(--accent);
      opacity: 1 !important;
    }

    .topping-btn.dimmed {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 2rem;
      padding: 1rem 2rem;
      font-family: inherit;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
      transition: transform 0.1s;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:active {
      transform: translateY(4px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn img {
      width: 28px;
      height: 28px;
    }

    #drink-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      font-size: 1.4em;
      padding: 1.2rem 2.5rem;
      margin-top: 2rem;
    }

    #drink-btn img {
      width: 36px;
      height: 36px;
    }

    .prize-container {
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .prize-img {
      width: 120px;
      height: 120px;
    }

    .prize-text {
      font-size: 1.4em;
      color: var(--primary);
      margin: 0.5rem 0;
    }

    .confetti {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 200;
    }

    .subtitle {
      font-size: 0.9em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .toppings-in-cup {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.3rem;
    }

    .toppings-in-cup img {
      width: 28px;
      height: 28px;
    }

    /* Toy playground */
    .toy-playground {
      width: 100%;
      height: 50vh;
      min-height: 300px;
      border-radius: 2rem;
      background: linear-gradient(135deg, #f0e6ff, #fff0f8, #e6f7ff);
      position: relative;
      overflow: hidden;
      margin: 1rem 0;
      box-shadow: inset 0 4px 12px var(--shadow);
      touch-action: none;
    }

    .toy {
      position: absolute;
      width: 100px;
      height: 100px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
      transition: filter 0.2s;
    }

    .toy:active {
      cursor: grabbing;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.25));
    }

    .toy img {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .toy-hint {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7em;
      color: var(--accent);
      text-align: center;
      opacity: 0.8;
      width: 90%;
    }

    .play-label {
      font-size: 0.85em;
      color: var(--accent);
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="crystal-bar">
  <img src="https://api.iconify.design/fluent-emoji/gem-stone.svg" alt="crystal">
  <span id="crystal-count">0</span>
</div>

<!-- Screen 1: Pick Color -->
<div class="screen active" id="screen-1">
  <h1>Super Drink Maker <img src="https://api.iconify.design/fluent-emoji/bubble-tea.svg" width="36" height="36" alt="boba" style="vertical-align:middle"></h1>
  <p class="subtitle">Pick your color!</p>
  <div class="cup-container">
    <svg id="cup-svg" width="140" height="220" viewBox="0 0 140 220">
      <defs>
        <linearGradient id="rainbow-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff4d6d"/>
          <stop offset="20%" stop-color="#ff8c42"/>
          <stop offset="40%" stop-color="#ffd166"/>
          <stop offset="60%" stop-color="#06d6a0"/>
          <stop offset="80%" stop-color="#118ab2"/>
          <stop offset="100%" stop-color="#7b2cbf"/>
        </linearGradient>
      </defs>
      <rect x="85" y="5" width="6" height="120" rx="3" fill="#e0e0e0"/>
      <rect x="82" y="5" width="12" height="15" rx="3" fill="#e0e0e0"/>
      <path d="M25,60 L20,200 Q20,215 35,215 L105,215 Q120,215 115,200 L110,60 Z" fill="none" stroke="#ccc" stroke-width="3"/>
      <path d="M25,60 Q67,30 110,60" fill="none" stroke="#ccc" stroke-width="3"/>
      <line x1="25" y1="60" x2="110" y2="60" stroke="#ccc" stroke-width="3"/>
      <clipPath id="cup-clip">
        <path d="M27,62 L22,198 Q22,213 37,213 L103,213 Q118,213 113,198 L108,62 Z"/>
      </clipPath>
      <rect id="cup-liquid" x="20" y="60" width="100" height="155" clip-path="url(#cup-clip)" fill="#ffb3d9" transform="scale(1,0)" transform-origin="center bottom" style="transform-origin: center bottom;"/>
    </svg>
  </div>
  <div class="color-grid" id="color-grid"></div>
  <button class="btn" id="btn-to-step2" disabled>Next <img src="https://api.iconify.design/fluent-emoji/right-arrow.svg" alt="→"></button>
</div>

<!-- Screen 2: Pick Toppings -->
<div class="screen" id="screen-2">
  <h1>Pick 2 Toppings!</h1>
  <p class="subtitle">Tap your favorites</p>
  <div class="cup-container" style="position:relative;">
    <svg id="cup-svg-2" width="140" height="220" viewBox="0 0 140 220">
      <defs>
        <linearGradient id="rainbow-grad-2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff4d6d"/>
          <stop offset="20%" stop-color="#ff8c42"/>
          <stop offset="40%" stop-color="#ffd166"/>
          <stop offset="60%" stop-color="#06d6a0"/>
          <stop offset="80%" stop-color="#118ab2"/>
          <stop offset="100%" stop-color="#7b2cbf"/>
        </linearGradient>
      </defs>
      <rect x="85" y="5" width="6" height="120" rx="3" fill="#e0e0e0"/>
      <rect x="82" y="5" width="12" height="15" rx="3" fill="#e0e0e0"/>
      <path d="M25,60 L20,200 Q20,215 35,215 L105,215 Q120,215 115,200 L110,60 Z" fill="none" stroke="#ccc" stroke-width="3"/>
      <path d="M25,60 Q67,30 110,60" fill="none" stroke="#ccc" stroke-width="3"/>
      <line x1="25" y1="60" x2="110" y2="60" stroke="#ccc" stroke-width="3"/>
      <clipPath id="cup-clip-2">
        <path d="M27,62 L22,198 Q22,213 37,213 L103,213 Q118,213 113,198 L108,62 Z"/>
      </clipPath>
      <rect id="cup-liquid-2" x="20" y="60" width="100" height="155" clip-path="url(#cup-clip-2)" fill="#ffb3d9" style="transform-origin: center bottom;"/>
    </svg>
    <div class="toppings-in-cup" id="toppings-in-cup"></div>
  </div>
  <div class="topping-grid" id="topping-grid"></div>
  <button class="btn" id="btn-to-step3" disabled>Next <img src="https://api.iconify.design/fluent-emoji/right-arrow.svg" alt="→"></button>
</div>

<!-- Screen 3: Drink It -->
<div class="screen" id="screen-3">
  <h1>Drink Up! <img src="https://api.iconify.design/fluent-emoji/cup-with-straw.svg" width="36" height="36" alt="drink" style="vertical-align:middle"></h1>
  <div class="cup-container" style="position:relative;">
    <svg id="cup-svg-3" width="180" height="280" viewBox="0 0 140 220">
      <defs>
        <linearGradient id="rainbow-grad-3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff4d6d"/>
          <stop offset="20%" stop-color="#ff8c42"/>
          <stop offset="40%" stop-color="#ffd166"/>
          <stop offset="60%" stop-color="#06d6a0"/>
          <stop offset="80%" stop-color="#118ab2"/>
          <stop offset="100%" stop-color="#7b2cbf"/>
        </linearGradient>
      </defs>
      <rect x="85" y="5" width="6" height="120" rx="3" fill="#e0e0e0"/>
      <rect x="82" y="5" width="12" height="15" rx="3" fill="#e0e0e0"/>
      <path d="M25,60 L20,200 Q20,215 35,215 L105,215 Q120,215 115,200 L110,60 Z" fill="none" stroke="#ccc" stroke-width="3"/>
      <path d="M25,60 Q67,30 110,60" fill="none" stroke="#ccc" stroke-width="3"/>
      <line x1="25" y1="60" x2="110" y2="60" stroke="#ccc" stroke-width="3"/>
      <clipPath id="cup-clip-3">
        <path d="M27,62 L22,198 Q22,213 37,213 L103,213 Q118,213 113,198 L108,62 Z"/>
      </clipPath>
      <rect id="cup-liquid-3" x="20" y="60" width="100" height="155" clip-path="url(#cup-clip-3)" fill="#ffb3d9" style="transform-origin: center bottom;"/>
    </svg>
    <div class="toppings-in-cup" id="toppings-in-cup-3"></div>
  </div>
  <button class="btn" id="drink-btn">DRINK <img src="https://api.iconify.design/fluent-emoji/bubble-tea.svg" alt="drink"></button>
</div>

<!-- Screen 4: Reward + Toy -->
<div class="screen" id="screen-4">
  <h1>You got a prize! <img src="https://api.iconify.design/fluent-emoji/party-popper.svg" width="36" height="36" alt="party" style="vertical-align:middle"></h1>
  <div class="prize-container">
    <img class="prize-img" id="prize-img" src="" alt="prize">
    <p class="prize-text" id="prize-text"></p>
    <p>+10 <img src="https://api.iconify.design/fluent-emoji/gem-stone.svg" width="20" height="20" alt="crystal" style="vertical-align:middle"> Crystals!</p>
  </div>
  <p class="play-label">Play with your toy below!</p>
  <div class="toy-playground" id="toy-playground">
    <div class="toy" id="toy">
      <img id="toy-img" src="" alt="toy">
    </div>
    <div class="toy-hint">Drag to move · Double-tap to bounce · Pinch to stretch</div>
  </div>
  <button class="btn" id="btn-restart">Make Another! <img src="https://api.iconify.design/fluent-emoji/bubble-tea.svg" alt="boba"></button>
</div>

<script>
  // Fluent Emoji icon URLs via Iconify CDN
  const ICONS = {
    bubbleTea: 'https://api.iconify.design/fluent-emoji/bubble-tea.svg',
    bear: 'https://api.iconify.design/fluent-emoji/bear.svg',
    cloud: 'https://api.iconify.design/fluent-emoji/cloud.svg',
    rainbow: 'https://api.iconify.design/fluent-emoji/rainbow.svg',
    chocolateBar: 'https://api.iconify.design/fluent-emoji/chocolate-bar.svg',
    // Prizes
    slime: 'https://api.iconify.design/fluent-emoji/bubbles.svg',
    squishy: 'https://api.iconify.design/fluent-emoji/teddy-bear.svg',
    doll: 'https://api.iconify.design/fluent-emoji/nesting-dolls.svg',
    unicorn: 'https://api.iconify.design/fluent-emoji/unicorn.svg',
    octopus: 'https://api.iconify.design/fluent-emoji/octopus.svg',
    butterfly: 'https://api.iconify.design/fluent-emoji/butterfly.svg',
    dragon: 'https://api.iconify.design/fluent-emoji/dragon.svg',
    star: 'https://api.iconify.design/fluent-emoji/glowing-star.svg',
    crystalBall: 'https://api.iconify.design/fluent-emoji/crystal-ball.svg',
    iceCream: 'https://api.iconify.design/fluent-emoji/ice-cream.svg',
    // UI
    gem: 'https://api.iconify.design/fluent-emoji/gem-stone.svg',
    party: 'https://api.iconify.design/fluent-emoji/party-popper.svg',
  };

  // State
  const state = {
    step: 1,
    cupColor: null,
    toppings: [],
    crystals: parseInt(localStorage.getItem('sdm-crystals') || '0'),
    prize: null
  };

  // Colors
  const colors = [
    { name: 'Red', value: '#ff4d6d' },
    { name: 'Orange', value: '#ff8c42' },
    { name: 'Yellow', value: '#ffd166' },
    { name: 'Green', value: '#06d6a0' },
    { name: 'Blue', value: '#118ab2' },
    { name: 'Purple', value: '#7b2cbf' },
    { name: 'Pink', value: '#ff6eb4' },
    { name: 'Brown', value: '#8b5e3c' },
    { name: 'Rainbow', value: 'linear-gradient(180deg, #ff4d6d, #ff8c42, #ffd166, #06d6a0, #118ab2, #7b2cbf)' }
  ];

  // Toppings with Fluent icons
  const toppings = [
    { name: 'Boba', icon: ICONS.bubbleTea },
    { name: 'Gummy Bears', icon: ICONS.bear },
    { name: 'Marshmallow', icon: ICONS.cloud },
    { name: 'Sprinkles', icon: ICONS.rainbow },
    { name: 'Chocolate', icon: ICONS.chocolateBar }
  ];

  // Prizes with Fluent icons
  const prizes = [
    { name: 'Slime', icon: ICONS.slime },
    { name: 'Teddy Squishy', icon: ICONS.squishy },
    { name: 'Nesting Doll', icon: ICONS.doll },
    { name: 'Unicorn', icon: ICONS.unicorn },
    { name: 'Octopus', icon: ICONS.octopus },
    { name: 'Butterfly', icon: ICONS.butterfly },
    { name: 'Dragon', icon: ICONS.dragon },
    { name: 'Magic Star', icon: ICONS.star },
    { name: 'Crystal Ball', icon: ICONS.crystalBall },
    { name: 'Ice Cream', icon: ICONS.iceCream }
  ];

  // Init
  document.getElementById('crystal-count').textContent = state.crystals;

  // Build color grid
  const colorGrid = document.getElementById('color-grid');
  colors.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'color-btn';
    btn.style.background = c.value;
    btn.title = c.name;
    btn.addEventListener('click', () => selectColor(c, btn));
    colorGrid.appendChild(btn);
  });

  function selectColor(color, btn) {
    state.cupColor = color.name === 'Rainbow' ? 'rainbow' : color.value;
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    const liquid = document.getElementById('cup-liquid');
    if (color.name === 'Rainbow') {
      liquid.setAttribute('fill', 'url(#rainbow-grad)');
    } else {
      liquid.setAttribute('fill', color.value);
    }

    gsap.fromTo('#cup-liquid', { attr: { transform: 'scale(1,0)' } }, {
      attr: { transform: 'scale(1,1)' },
      duration: 0.8,
      ease: 'power2.out'
    });

    document.getElementById('btn-to-step2').disabled = false;
    playPop();
  }

  // Build topping grid
  const toppingGrid = document.getElementById('topping-grid');
  toppings.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'topping-btn';
    btn.innerHTML = `<img src="${t.icon}" alt="${t.name}"><span class="topping-label">${t.name}</span>`;
    btn.title = t.name;
    btn.dataset.name = t.name;
    btn.addEventListener('click', () => selectTopping(t, btn));
    toppingGrid.appendChild(btn);
  });

  function selectTopping(topping, btn) {
    if (btn.classList.contains('dimmed')) return;
    if (btn.classList.contains('selected')) return;
    if (state.toppings.length >= 2) return;

    state.toppings.push(topping);
    btn.classList.add('selected');

    gsap.to(btn, { scale: 1.4, duration: 0.15, yoyo: true, repeat: 1 });

    const cupToppings = document.getElementById('toppings-in-cup');
    const img = document.createElement('img');
    img.src = topping.icon;
    img.alt = topping.name;
    img.style.opacity = '0';
    cupToppings.appendChild(img);
    gsap.fromTo(img, { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'bounce.out' });

    playPop();

    if (state.toppings.length >= 2) {
      document.querySelectorAll('.topping-btn').forEach(b => {
        if (!b.classList.contains('selected')) b.classList.add('dimmed');
      });
      document.getElementById('btn-to-step3').disabled = false;
    }
  }

  // Navigation
  document.getElementById('btn-to-step2').addEventListener('click', () => {
    showScreen(2);
    const liquid2 = document.getElementById('cup-liquid-2');
    if (state.cupColor === 'rainbow') {
      liquid2.setAttribute('fill', 'url(#rainbow-grad-2)');
    } else {
      liquid2.setAttribute('fill', state.cupColor);
    }
  });

  document.getElementById('btn-to-step3').addEventListener('click', () => {
    showScreen(3);
    const liquid3 = document.getElementById('cup-liquid-3');
    if (state.cupColor === 'rainbow') {
      liquid3.setAttribute('fill', 'url(#rainbow-grad-3)');
    } else {
      liquid3.setAttribute('fill', state.cupColor);
    }
    const cupToppings3 = document.getElementById('toppings-in-cup-3');
    cupToppings3.innerHTML = '';
    state.toppings.forEach(t => {
      const img = document.createElement('img');
      img.src = t.icon;
      img.alt = t.name;
      cupToppings3.appendChild(img);
    });
    gsap.to('#drink-btn', { scale: 1.05, duration: 0.6, yoyo: true, repeat: -1, ease: 'sine.inOut' });
  });

  document.getElementById('drink-btn').addEventListener('click', () => {
    const btn = document.getElementById('drink-btn');
    btn.disabled = true;
    gsap.killTweensOf('#drink-btn');
    gsap.set('#drink-btn', { scale: 1 });

    playSlurp();

    gsap.to('#cup-liquid-3', {
      attr: { height: 0, y: 215 },
      duration: 2.5,
      ease: 'power1.in',
      onComplete: () => {
        setTimeout(() => showScreen(4), 300);
      }
    });
  });

  document.getElementById('btn-restart').addEventListener('click', resetGame);

  function showScreen(num) {
    state.step = num;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(`screen-${num}`).classList.add('active');

    if (num === 4) {
      showReward();
    }
  }

  function showReward() {
    const prize = prizes[Math.floor(Math.random() * prizes.length)];
    state.prize = prize;

    document.getElementById('prize-img').src = prize.icon;
    document.getElementById('prize-text').textContent = `You won: ${prize.name}!`;

    // Setup toy
    const toyImg = document.getElementById('toy-img');
    toyImg.src = prize.icon;
    const toy = document.getElementById('toy');
    toy.style.left = 'calc(50% - 50px)';
    toy.style.top = 'calc(50% - 50px)';
    gsap.set(toy, { scale: 1, rotation: 0, x: 0, y: 0, scaleX: 1, scaleY: 1 });

    setTimeout(() => initToy(), 100);

    createConfetti();

    state.crystals += 10;
    localStorage.setItem('sdm-crystals', state.crystals.toString());
    const counter = document.getElementById('crystal-count');
    gsap.to(counter, {
      innerText: state.crystals,
      duration: 0.8,
      snap: { innerText: 1 },
      ease: 'power1.out'
    });

    playChime();
  }

  // ============ TOY PLAYGROUND ============
  let toyHammer = null;
  let toyState = { x: 0, y: 0, scale: 1, startX: 0, startY: 0, startScale: 1 };

  function initToy() {
    const toy = document.getElementById('toy');
    const playground = document.getElementById('toy-playground');

    if (toyHammer) {
      toyHammer.destroy();
    }

    toyState = { x: 0, y: 0, scale: 1, startX: 0, startY: 0, startScale: 1 };

    toyHammer = new Hammer.Manager(toy, {
      recognizers: [
        [Hammer.Pan, { direction: Hammer.DIRECTION_ALL }],
        [Hammer.Pinch, { enable: true }],
        [Hammer.Tap, { event: 'doubletap', taps: 2 }]
      ]
    });

    // Allow pinch and pan simultaneously
    toyHammer.get('pinch').recognizeWith(toyHammer.get('pan'));

    // Drag / Pan
    toyHammer.on('panstart', () => {
      toyState.startX = toyState.x;
      toyState.startY = toyState.y;
      gsap.to(toy, { scale: toyState.scale * 1.05, duration: 0.1 });
    });

    toyHammer.on('panmove', (e) => {
      toyState.x = toyState.startX + e.deltaX;
      toyState.y = toyState.startY + e.deltaY;

      const bounds = playground.getBoundingClientRect();
      const toySize = 100 * toyState.scale;
      const maxX = bounds.width / 2 - toySize / 2;
      const maxY = bounds.height / 2 - toySize / 2;
      toyState.x = Math.max(-maxX, Math.min(maxX, toyState.x));
      toyState.y = Math.max(-maxY, Math.min(maxY, toyState.y));

      gsap.set(toy, { x: toyState.x, y: toyState.y });
    });

    toyHammer.on('panend', (e) => {
      const vx = e.velocityX;
      const vy = e.velocityY;

      // Momentum
      gsap.to(toyState, {
        x: toyState.x + vx * 60,
        y: toyState.y + vy * 60,
        duration: 0.5,
        ease: 'power3.out',
        onUpdate: () => {
          gsap.set(toy, { x: toyState.x, y: toyState.y });
        }
      });

      // Squishy squash on land
      gsap.to(toy, {
        scaleX: toyState.scale * 1.25,
        scaleY: toyState.scale * 0.75,
        duration: 0.1,
        ease: 'power2.out',
        onComplete: () => {
          gsap.to(toy, {
            scaleX: toyState.scale,
            scaleY: toyState.scale,
            duration: 0.5,
            ease: 'elastic.out(1, 0.3)'
          });
        }
      });

      playPop();
    });

    // Pinch to stretch (squishy!)
    toyHammer.on('pinchstart', () => {
      toyState.startScale = toyState.scale;
    });

    toyHammer.on('pinchmove', (e) => {
      toyState.scale = Math.max(0.4, Math.min(2.5, toyState.startScale * e.scale));

      // Squishy deformation - stretch in pinch direction
      const angle = e.rotation * (Math.PI / 180);
      const stretchX = toyState.scale * (1 + Math.abs(Math.cos(angle)) * 0.3);
      const stretchY = toyState.scale * (1 + Math.abs(Math.sin(angle)) * 0.3);

      gsap.set(toy, { scaleX: stretchX, scaleY: stretchY });
    });

    toyHammer.on('pinchend', () => {
      // Spring back with jelly wobble
      gsap.to(toy, {
        scaleX: toyState.scale,
        scaleY: toyState.scale,
        duration: 0.8,
        ease: 'elastic.out(1, 0.25)'
      });
      playPop();
    });

    // Double-tap to bounce
    toyHammer.on('doubletap', () => {
      const tl = gsap.timeline();

      // Squash down
      tl.to(toy, {
        scaleX: toyState.scale * 1.4,
        scaleY: toyState.scale * 0.5,
        duration: 0.1,
        ease: 'power3.in'
      })
      // Launch up + stretch tall
      .to(toy, {
        y: toyState.y - 140,
        scaleX: toyState.scale * 0.7,
        scaleY: toyState.scale * 1.4,
        duration: 0.3,
        ease: 'power2.out'
      })
      // Fall back down + squash
      .to(toy, {
        y: toyState.y,
        scaleX: toyState.scale * 1.3,
        scaleY: toyState.scale * 0.7,
        duration: 0.25,
        ease: 'power2.in'
      })
      // Wobble settle
      .to(toy, {
        scaleX: toyState.scale * 0.9,
        scaleY: toyState.scale * 1.1,
        duration: 0.15,
        ease: 'power1.out'
      })
      .to(toy, {
        scaleX: toyState.scale,
        scaleY: toyState.scale,
        duration: 0.5,
        ease: 'elastic.out(1, 0.3)'
      });

      // Spin for fun
      gsap.to(toy, { rotation: '+=360', duration: 0.55, ease: 'power2.out' });

      playBoing();
    });
  }

  function createConfetti() {
    const container = document.body;
    const confettiColors = ['#ff4d6d', '#ff8c42', '#ffd166', '#06d6a0', '#118ab2', '#7b2cbf', '#ff6eb4', '#b388ff'];

    for (let i = 0; i < 25; i++) {
      const div = document.createElement('div');
      div.className = 'confetti';
      div.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      div.style.left = '50%';
      div.style.top = '35%';
      div.style.width = (8 + Math.random() * 10) + 'px';
      div.style.height = (8 + Math.random() * 10) + 'px';
      div.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      container.appendChild(div);

      gsap.fromTo(div,
        { x: 0, y: 0, opacity: 1, rotation: 0 },
        {
          x: (Math.random() - 0.5) * 350,
          y: (Math.random() - 0.5) * 400 - 100,
          rotation: Math.random() * 720 - 360,
          opacity: 0,
          duration: 1.2 + Math.random() * 0.5,
          delay: i * 0.025,
          ease: 'power2.out',
          onComplete: () => div.remove()
        }
      );
    }
  }

  function resetGame() {
    state.step = 1;
    state.cupColor = null;
    state.toppings = [];
    state.prize = null;

    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('btn-to-step2').disabled = true;

    document.querySelectorAll('.topping-btn').forEach(b => {
      b.classList.remove('selected', 'dimmed');
    });
    document.getElementById('btn-to-step3').disabled = true;
    document.getElementById('toppings-in-cup').innerHTML = '';
    document.getElementById('toppings-in-cup-3').innerHTML = '';

    gsap.set('#cup-liquid', { attr: { transform: 'scale(1,0)' } });
    gsap.set('#cup-liquid-3', { attr: { height: 155, y: 60 } });

    document.getElementById('drink-btn').disabled = false;

    if (toyHammer) {
      toyHammer.destroy();
      toyHammer = null;
    }

    showScreen(1);
  }

  // ============ AUDIO ============
  function playSlurp() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(400, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.8);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  }

  function playPop() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  }

  function playBoing() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  }

  function playChime() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.3);
    });
  }
</script>
